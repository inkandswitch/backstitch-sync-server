[package]
name = "backstitch-sync-server"
version = "2.0.0"
edition = "2021"

[dependencies]
automerge = "0.10.0"
samod = { version = "0.12.0", git = "https://github.com/LilithSilver/samod", branch = "lilith-updates", features = ["tokio", "threadpool", "axum"] }
futures = "0.3.33"
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tracing = "0.1.40"
tracing-appender = "0.2.5"
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4"] }
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
rayon = "1.12.0"
chrono = "0.4.45"
thiserror = "2.0.19"
serde = { version = "1.0.229", features = ["derive"] }
tokio-util = "0.7.19"
clap = { version = "4.6.5", features = ["derive"] }
url = { version = "2.5.8", features = ["serde"] }
jwt-authorizer = { version = "0.15.0", git = "https://github.com/LilithSilver/jwt-authorizer", branch = "silver-fork" }
reqwest = "0.13.4"

# create profile release_debug
[profile.release_debug]
inherits = "release"
opt-level = 0
debug = true
lto = false
panic = "abort"
codegen-units = 1
panic-strategy = "abort"
#config flag "release_debug"

# set release_debug as default profile
default = ["release_debug"]
