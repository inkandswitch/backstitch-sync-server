[package]
name = "backstitch-sync-server"
version = "2.0.0"
edition = "2021"

[dependencies]
futures = "0.3.33"
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tracing = "0.1.40"
tracing-appender = "0.2.5"
serde_json = "1.0.151"
uuid = { version = "1.24.0", features = ["v4"] }
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["cors", "fs", "set-header"] }
rayon = "1.12.0"
chrono = "0.4.45"
thiserror = "2.0.19"
serde = { version = "1.0.229", features = ["derive"] }
tokio-util = "0.7.19"
clap = { version = "4.6.5", features = ["derive"] }
url = { version = "2.5.8", features = ["serde"] }
jwt-authorizer = { version = "0.15.0", git = "https://github.com/LilithSilver/jwt-authorizer", branch = "silver-fork" }
reqwest = "0.13.4"
tower = "0.5.3"
future_form = "0.3.1"
rand = "0.10.2"
tungstenite = "0.30.0"
hyper = "1.11.1"
futures-util = "0.3.34"
axum-core = "0.5.6"
base64 = "0.23.1"
bytes = "1.12.1"
sha1 = "0.11.0"
hyper-util = "0.1.20"
http = "1.5.0"
async-tungstenite = { version = "0.31.0", features = ["tokio", "tokio-runtime"] }
secrecy = "0.10.3"
hex = "0.4.3"

# automergy stuff
subduction_core = "0.18.0"
sedimentree_core = { version = "0.14.0", features = ["serde"] }
subduction_redb_storage = "0.2.0"
subduction_websocket = { version = "0.12.0", features = [
    "tokio_base",
    "tokio_client",
] }
subduction_crypto = "0.9.0"
automerge = "0.11.0"
autosurgeon = "0.13.0"

# create profile release_debug
[profile.release_debug]
inherits = "release"
opt-level = 0
debug = true
lto = false
panic = "abort"
codegen-units = 1
panic-strategy = "abort"
#config flag "release_debug"

# set release_debug as default profile
default = ["release_debug"]
