# This is a configuration example with OpenID Connect.
# You'll need an OpenID Connect authentication endpoint, in addition to this server.
# This is recommended only for enterprise users with an existing SSO OAuth backend.
services:
  backstitch-sync-server:
    image: ghcr.io/inkandswitch/backstitch-sync-server:latest
    restart: unless-stopped
    environment:
      # The authentication scheme to use. This MUST be specified.
      AUTH: "oidc"
      # The OpenID Connect issuer URL to authenticate with.
      OIDC_ISSUER: "https://example.com/"
      # The OpenID Connect Client ID registered with your OIDC provider.
      OIDC_CLIENT_ID: "backstitch"
      # The port of the OpenID Connect Redirect URL registered with your OIDC provider. This can be an arbitrary port.
      # By default, it is 58656.
      # The full registered redirect URL ***MUST*** be "http://localhost:PORT"!
      OIDC_REDIRECT_PORT: "58656"

    ports:
      - "80:3000" # Change the first part to the desired external HTTP server port. This will be the port entered into the Backstitch client.
                  # If you don't want to enter a port in the Backstitch client, it defaults to port 80. (TODO: Change this to 443 when we have HTTPS?)
    volumes:
      # For data persistance, mount this backstitch-data volume.
      - backstitch-data:/data

volumes:
  backstitch-data:
