# This is a basic, minimal setup of the Backstitch Sync Server with Docker Compose.
# It does not include any authentication, HTTPS, or the webviewer.

services:
  backstitch-sync-server:
    image: ghcr.io/inkandswitch/backstitch-sync-server:latest
    restart: unless-stopped
    environment:
      # The authentication scheme to use. This MUST be specified.
      # When using AUTH: "none", it is highly recommended to hide the server behind a
      # VPN tunnel service like Tailscale or ZeroTier.
      # Those will provide secure, easy authentication setup.
      AUTH: "none"

    # Setting this to "80", as shown, will expose the HTTP server directly at
    # http://localhost. If you set it to something other than 80, like 8085,
    # you'll need to use http://localhost:8085.
    # If you have a domain name, we highly recommend using a HTTPS reverse-proxy
    # service like Caddy instead.
    # For an example with Caddy, see `docker-compose.caddy.yaml`. 
    ports:
      - "80:3000"

    volumes:
      # For data persistance, mount this backstitch-data volume.
      - backstitch-data:/data

volumes:
  backstitch-data:
